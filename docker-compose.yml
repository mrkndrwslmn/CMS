services:
  # --- Laravel App (PHP + Apache + Node.js) ---
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: treis-adiutor-app
    restart: "no"
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html:cached
      - /var/www/html/vendor
      - /var/www/html/node_modules
      - vite_cache:/var/www/html/node_modules/.vite
      - bootstrap_cache:/var/www/html/bootstrap/cache
      - framework_cache:/var/www/html/storage/framework
      - ./storage/logs:/var/www/html/storage/logs:delegated
    ports:
      - "8000:80"
      - "5173:5173"
    depends_on:
      - mysql
      - redis
    environment:
      - APACHE_RUN_USER=www-data
      - APACHE_RUN_GROUP=www-data
      - DB_HOST=mysql
      - DB_DATABASE=cms
      - DB_USERNAME=root
      - DB_PASSWORD=secret
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - laravel-network

  # --- MySQL Database ---
  mysql:
    image: mysql:8.0
    container_name: treis-adiutor-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: cms
      MYSQL_USER: cms_user
      MYSQL_PASSWORD: cms_password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/my.cnf
    ports:
      - "3308:3306"
    command: --default-authentication-plugin=mysql_native_password
    networks:
      - laravel-network

  # --- Redis Cache/Session Store ---
  redis:
    image: redis:7-alpine
    container_name: treis-adiutor-redis
    restart: "no"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - laravel-network

  # --- phpMyAdmin ---
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: treis-adiutor-phpmyadmin
    restart: "no"
    depends_on:
      - mysql
    ports:
      - "8080:80"
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: secret
      PMA_ARBITRARY: 1
    networks:
      - laravel-network

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  vite_cache:
    driver: local
  bootstrap_cache:
    driver: local
  framework_cache:
    driver: local

networks:
  laravel-network:
    driver: bridge
