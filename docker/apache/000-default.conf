<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
        Options -Indexes +FollowSymLinks
        
        # Laravel pretty URLs
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ index.php [QSA,L]
        </IfModule>
    </Directory>

    # Custom log format with response time in seconds (%T) and microseconds (%D)
    # Format: [timestamp] "METHOD /path" STATUS TIME_SECONDS (TIME_MICROSECONDSμs) BYTES
    LogFormat "[%{%Y-%m-%d %H:%M:%S}t] \"%r\" %>s %Ts (%Dμs) %b" timed
    
    # Logging - use pipe to cat for Docker stdout visibility
    ErrorLog "|/bin/cat"
    CustomLog "|/bin/cat" timed
</VirtualHost>